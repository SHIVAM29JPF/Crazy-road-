<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Crazy Road V2.2</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#75c95b;
    font-family:Arial,sans-serif;
    touch-action:none;
}

#game{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:#75c95b;
}

/* ================= ROAD ================= */

#road{
    position:absolute;
    left:8%;
    width:84%;
    height:100%;
    background:linear-gradient(
        90deg,
        #222 0%,
        #3e3e3e 50%,
        #222 100%
    );
    border-left:6px solid white;
    border-right:6px solid white;
    overflow:hidden;
    z-index:5;
}

.roadLine{
    position:absolute;
    width:7px;
    height:85px;
    left:50%;
    transform:translateX(-50%);
    background:white;
    border-radius:5px;
}

/* ================= SCENERY ================= */

#scenery{
    position:absolute;
    inset:0;
    z-index:2;
    pointer-events:none;
    overflow:hidden;
}

/* Grass */

.grass{
    position:absolute;
    width:100%;
    height:100%;
    background:
      repeating-linear-gradient(
        90deg,
        rgba(0,100,0,.08) 0px,
        rgba(0,100,0,.08) 2px,
        transparent 2px,
        transparent 22px
      );
}

/* Tree */

.tree{
    position:absolute;
    width:75px;
    height:130px;
}

.tree .trunk{
    position:absolute;
    width:18px;
    height:75px;
    bottom:0;
    left:29px;
    background:linear-gradient(
        90deg,
        #633c1d,
        #9a602e,
        #543217
    );
    border-radius:5px;
}

.tree .leaves{
    position:absolute;
    width:70px;
    height:70px;
    left:3px;
    top:5px;
    background:#167a28;
    border-radius:50%;
    box-shadow:
        -18px 20px 0 #209a32,
        18px 18px 0 #126a22,
        0 35px 0 #18832a;
}

/* Coconut tree */

.palm{
    position:absolute;
    width:100px;
    height:170px;
}

.palm .palmTrunk{
    position:absolute;
    width:13px;
    height:125px;
    left:45px;
    bottom:0;
    background:linear-gradient(
        90deg,
        #65401d,
        #b87938,
        #543416
    );
    border-radius:50%;
    transform:rotate(5deg);
}

.palm .crown{
    position:absolute;
    width:18px;
    height:18px;
    border-radius:50%;
    background:#4f3216;
    left:40px;
    top:25px;
}

.palm .leaf{
    position:absolute;
    width:65px;
    height:11px;
    background:#157b25;
    border-radius:100% 0 100% 0;
    left:48px;
    top:29px;
    transform-origin:left center;
}

.palm .l1{transform:rotate(-20deg)}
.palm .l2{transform:rotate(20deg)}
.palm .l3{transform:rotate(55deg)}
.palm .l4{transform:rotate(-55deg)}
.palm .l5{transform:rotate(95deg)}
.palm .l6{transform:rotate(-95deg)}

.coconut{
    position:absolute;
    width:13px;
    height:13px;
    background:#6b3d17;
    border-radius:50%;
    left:39px;
    top:38px;
}

/* Building */

.building{
    position:absolute;
    width:100px;
    height:145px;
}

.buildingBody{
    position:absolute;
    bottom:0;
    left:8px;
    width:84px;
    height:115px;
    background:linear-gradient(
        90deg,
        #bdbdbd,
        #e8e8e8,
        #aaa
    );
    border:3px solid #777;
}

.roof{
    position:absolute;
    top:0;
    left:0;
    width:100px;
    height:38px;
    background:#8d2c24;
    clip-path:polygon(
        50% 0,
        100% 100%,
        0 100%
    );
}

.window{
    position:absolute;
    width:18px;
    height:25px;
    background:#6ed9ff;
    border:2px solid #444;
}

.w1{
    left:20px;
    bottom:48px;
}

.w2{
    right:20px;
    bottom:48px;
}

.door{
    position:absolute;
    width:23px;
    height:43px;
    left:31px;
    bottom:0;
    background:#70452c;
    border:2px solid #49301f;
}

/* Small bush */

.bush{
    position:absolute;
    width:65px;
    height:35px;
    bottom:0;
}

.bush:before{
    content:"";
    position:absolute;
    width:35px;
    height:35px;
    left:4px;
    bottom:0;
    background:#126b24;
    border-radius:50%;
    box-shadow:
        22px 4px 0 #17812b,
        40px 10px 0 #0e5d1e;
}


/* ================= PLAYER ================= */

#car{
    position:absolute;
    width:64px;
    height:110px;
    bottom:55px;
    transform:translateX(-50%);
    background:linear-gradient(
        90deg,
        #780000,
        #ff1515,
        #a00000
    );
    border-radius:18px 18px 12px 12px;
    box-shadow:0 6px 16px rgba(0,0,0,.8);
    z-index:20;
}

#car:before{
    content:"";
    position:absolute;
    width:40px;
    height:30px;
    left:12px;
    top:18px;
    background:linear-gradient(
        135deg,
        #050505,
        #66727c,
        #050505
    );
    border-radius:10px;
}

#car:after{
    content:"";
    position:absolute;
    width:7px;
    height:95px;
    left:28px;
    top:8px;
    background:white;
    border-radius:5px;
}

.f1wing{
    position:absolute;
    left:-12px;
    width:88px;
    height:9px;
    background:#111;
    border-radius:5px;
}

.frontWing{top:4px}
.rearWing{bottom:2px}

.playerWheel{
    position:absolute;
    width:10px;
    height:28px;
    background:#050505;
    border-radius:5px;
    z-index:-1;
}

.pwl{left:-7px;top:27px}
.pwr{right:-7px;top:27px}
.pwl2{left:-7px;bottom:20px}
.pwr2{right:-7px;bottom:20px}


/* ================= ENEMIES ================= */

.enemy{
    position:absolute;
    width:58px;
    height:105px;
    border-radius:17px 17px 11px 11px;
    box-shadow:0 5px 12px rgba(0,0,0,.75);
    z-index:15;
}

.enemy:before{
    content:"";
    position:absolute;
    width:38px;
    height:28px;
    left:10px;
    top:15px;
    background:linear-gradient(
        135deg,
        #111,
        #59636b,
        #111
    );
    border-radius:9px;
}

.enemy:after{
    content:"";
    position:absolute;
    width:6px;
    height:90px;
    left:26px;
    top:8px;
    background:rgba(255,255,255,.5);
    border-radius:4px;
}

.green{
    background:linear-gradient(
        90deg,#087000,#20d51d,#087000
    );
}

.yellow{
    background:linear-gradient(
        90deg,#b07b00,#ffd21c,#b07b00
    );
}

.blue{
    background:linear-gradient(
        90deg,#003d9e,#087cff,#003d9e
    );
}

.white{
    background:linear-gradient(
        90deg,#999,#fff,#aaa
    );
}

.purple{
    background:linear-gradient(
        90deg,#55008f,#b62cff,#55008f
    );
}


/* ================= COIN ================= */

.coin{
    position:absolute;
    width:35px;
    height:35px;
    border-radius:50%;
    background:radial-gradient(
        circle,
        #fff36a,
        #ffd000 40%,
        #ef9800 75%,
        #9b5500
    );
    border:3px solid #ffe45c;
    box-shadow:
        0 0 12px #ffd000,
        0 0 25px rgba(255,208,0,.5);
    z-index:13;
    animation:spin .55s linear infinite;
}

.coin:after{
    content:"★";
    position:absolute;
    color:white;
    font-size:18px;
    left:6px;
    top:3px;
}

@keyframes spin{
    from{transform:rotateY(0)}
    to{transform:rotateY(360deg)}
}


/* ================= OBSTACLES ================= */

.obstacle{
    position:absolute;
    width:55px;
    height:38px;
    background:repeating-linear-gradient(
        135deg,
        #ff7b00,
        #ff7b00 9px,
        #222 9px,
        #222 18px
    );
    border:3px solid white;
    border-radius:7px;
    z-index:14;
}

.cone{
    position:absolute;
    width:28px;
    height:42px;
    background:linear-gradient(
        90deg,
        #b83c00,
        #ff6500,
        #b83c00
    );
    clip-path:polygon(
        50% 0,
        100% 100%,
        0 100%
    );
    z-index:14;
}


/* ================= HUD ================= */

#hud{
    position:absolute;
    top:12px;
    left:12px;
    z-index:50;
    color:white;
    background:rgba(0,0,0,.65);
    padding:9px 13px;
    border-radius:13px;
    font-size:17px;
    line-height:1.5;
    font-weight:bold;
    text-shadow:2px 2px 3px black;
}

#speedText{
    color:#ffe000;
}


/* ================= BUTTONS ================= */

#pause{
    position:absolute;
    top:15px;
    right:15px;
    z-index:70;
    width:48px;
    height:48px;
    border-radius:50%;
    border:2px solid white;
    background:rgba(0,0,0,.7);
    color:white;
    font-size:22px;
    display:none;
}


/* ================= MENU ================= */

#menu{
    position:absolute;
    inset:0;
    z-index:100;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    background:rgba(0,0,0,.62);
}

.panel{
    width:86%;
    max-width:360px;
    padding:30px 22px;
    border-radius:25px;
    background:rgba(10,10,10,.92);
    color:white;
    box-shadow:0 10px 40px rgba(0,0,0,.8);
}

.title{
    font-size:40px;
    font-weight:900;
    color:#ff2020;
    text-shadow:3px 3px 0 #600;
    margin-bottom:8px;
}

.subtitle{
    color:#ddd;
    margin-bottom:20px;
}

.stat{
    font-size:20px;
    margin:8px;
}

.mainButton{
    width:90%;
    padding:15px;
    margin-top:18px;
    border-radius:14px;
    background:#e81717;
    color:white;
    font-size:22px;
    box-shadow:0 5px 0 #850000;
}

.soundButton{
    margin-top:15px;
    padding:11px 18px;
    border-radius:12px;
    background:#333;
    color:white;
    font-size:16px;
}


/* ================= PAUSE ================= */

#pauseMenu{
    position:absolute;
    inset:0;
    z-index:90;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.65);
    color:white;
    text-align:center;
}

.pauseBox{
    background:rgba(0,0,0,.92);
    padding:30px;
    border-radius:22px;
}

.smallButton{
    padding:13px 25px;
    margin:7px;
    border-radius:12px;
    background:#444;
    color:white;
    font-size:18px;
}


/* ================= EFFECTS ================= */

.crash{
    position:absolute;
    width:100px;
    height:100px;
    border-radius:50%;
    border:6px solid #ffb000;
    box-shadow:
        0 0 20px #ff6500,
        0 0 40px #f00;
    animation:crashAnimation .5s ease-out forwards;
    z-index:95;
}

@keyframes crashAnimation{
    from{
        transform:scale(.2);
        opacity:1;
    }

    to{
        transform:scale(2);
        opacity:0;
    }
}

.coinPop{
    position:absolute;
    color:#ffe000;
    font-size:22px;
    font-weight:bold;
    z-index:95;
    animation:coinAnimation .7s ease-out forwards;
}

@keyframes coinAnimation{
    from{
        transform:translateY(0) scale(.5);
        opacity:1;
    }

    to{
        transform:translateY(-60px) scale(1.4);
        opacity:0;
    }
}

</style>
</head>

<body>

<div id="game">

    <!-- SIDE SCENERY -->

    <div id="scenery">
        <div class="grass"></div>

        <div class="tree" id="tree1">
            <div class="leaves"></div>
            <div class="trunk"></div>
        </div>

        <div class="tree" id="tree2">
            <div class="leaves"></div>
            <div class="trunk"></div>
        </div>

        <div class="palm" id="palm1">
            <div class="palmTrunk"></div>
            <div class="crown"></div>

            <div class="leaf l1"></div>
            <div class="leaf l2"></div>
            <div class="leaf l3"></div>
            <div class="leaf l4"></div>
            <div class="leaf l5"></div>
            <div class="leaf l6"></div>

            <div class="coconut"></div>
        </div>

        <div class="building" id="building1">
            <div class="roof"></div>

            <div class="buildingBody">

                <div class="window w1"></div>
                <div class="window w2"></div>

                <div class="door"></div>

            </div>
        </div>

        <div class="bush" id="bush1"></div>
        <div class="bush" id="bush2"></div>

    </div>


    <!-- ROAD -->

    <div id="road"></div>


    <!-- HUD -->

    <div id="hud">
        🏆 Score: <span id="score">0</span><br>
        🥇 Best: <span id="best">0</span><br>
        🪙 Coins: <span id="coins">0</span><br>
        ⚡ Speed:
        <span id="speedText">100</span> km/h
    </div>


    <!-- PAUSE -->

    <button id="pause">Ⅱ</button>


    <!-- MENU -->

    <div id="menu">

        <div class="panel">

            <div class="title" id="menuTitle">
                CRAZY ROAD
            </div>

            <div class="subtitle" id="menuSubtitle">
                2D HIGHWAY RACER
            </div>

            <div class="stat">
                🥇 Best:
                <span id="menuBest">0</span>
            </div>

            <div class="stat">
                🪙 Coins:
                <span id="menuCoins">0</span>
            </div>

            <button
                class="mainButton"
                id="playButton">
                ▶ PLAY
            </button>

            <br>

            <button
                class="soundButton"
                id="soundButton">
                🔊 SOUND ON
            </button>

        </div>

    </div>


    <!-- PAUSE MENU -->

    <div id="pauseMenu">

        <div class="pauseBox">

            <h1>⏸️ PAUSED</h1>

            <button
                class="smallButton"
                id="resumeButton">
                ▶ Resume
            </button>

            <button
                class="smallButton"
                id="quitButton">
                🏠 Menu
            </button>

        </div>

    </div>


    <!-- PLAYER CAR -->

    <div id="car">

        <div class="f1wing frontWing"></div>
        <div class="f1wing rearWing"></div>

        <div class="playerWheel pwl"></div>
        <div class="playerWheel pwr"></div>

        <div class="playerWheel pwl2"></div>
        <div class="playerWheel pwr2"></div>

    </div>

</div>


<script>

/* ==========================================
   ELEMENTS
========================================== */

const game =
    document.getElementById("game");

const road =
    document.getElementById("road");

const player =
    document.getElementById("car");

const menu =
    document.getElementById("menu");

const pauseMenu =
    document.getElementById("pauseMenu");

const pauseButton =
    document.getElementById("pause");

const playButton =
    document.getElementById("playButton");

const resumeButton =
    document.getElementById("resumeButton");

const quitButton =
    document.getElementById("quitButton");

const soundButton =
    document.getElementById("soundButton");

const scoreText =
    document.getElementById("score");

const bestText =
    document.getElementById("best");

const coinsText =
    document.getElementById("coins");

const speedText =
    document.getElementById("speedText");

const menuBest =
    document.getElementById("menuBest");

const menuCoins =
    document.getElementById("menuCoins");

const menuTitle =
    document.getElementById("menuTitle");

const menuSubtitle =
    document.getElementById("menuSubtitle");


/* ==========================================
   SCENERY ELEMENTS
========================================== */

const tree1 =
    document.getElementById("tree1");

const tree2 =
    document.getElementById("tree2");

const palm1 =
    document.getElementById("palm1");

const building1 =
    document.getElementById("building1");

const bush1 =
    document.getElementById("bush1");

const bush2 =
    document.getElementById("bush2");


/* ==========================================
   VARIABLES
========================================== */

let playerX = 0;

let score = 0;

let best =
    Number(
        localStorage.getItem(
            "crazyRoadBest"
        )
    ) || 0;

let totalCoins =
    Number(
        localStorage.getItem(
            "crazyRoadCoins"
        )
    ) || 0;

let gameSpeed = 5;

let displaySpeed = 100;

let running = false;

let paused = false;

let crashed = false;

let soundOn = true;

let enemies = [];

let coinObjects = [];

let obstacles = [];

let roadLines = [];

let sceneryObjects = [];

let lastEnemy = 0;

let lastCoin = 0;

let lastObstacle = 0;

let lastScenery = 0;

let lastTime = 0;

let lastTouchX = 0;

let audioContext = null;


/* ==========================================
   DISPLAY
========================================== */

bestText.innerText = best;

coinsText.innerText = totalCoins;

menuBest.innerText = best;

menuCoins.innerText = totalCoins;


/* ==========================================
   INITIAL SCENERY
========================================== */

function positionInitialScenery(){

    tree1.style.left =
        "1%";

    tree1.style.top =
        "12%";

    tree2.style.right =
        "1%";

    tree2.style.top =
        "43%";

    palm1.style.left =
        "0%";

    palm1.style.top =
        "65%";

    building1.style.right =
        "0%";

    building1.style.top =
        "8%";

    bush1.style.left =
        "1%";

    bush1.style.bottom =
        "7%";

    bush2.style.right =
        "1%";

    bush2.style.bottom =
        "25%";
}

positionInitialScenery();


/* ==========================================
   AUDIO
========================================== */

function startAudio(){

    if(!soundOn)
        return;

    if(audioContext)
        return;

    try{

        audioContext =
            new(
                window.AudioContext ||
                window.webkitAudioContext
            )();

    }catch(error){

        console.log(
            "Audio unavailable"
        );
    }
}


function beep(
    frequency,
    duration,
    type="sine"
){

    if(
        !soundOn ||
        !audioContext
    )
        return;

    const oscillator =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();

    oscillator.type =
        type;

    oscillator.frequency.value =
        frequency;

    gain.gain.setValueAtTime(
        .08,
        audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        .001,
        audioContext.currentTime +
        duration
    );

    oscillator.connect(gain);

    gain.connect(
        audioContext.destination
    );

    oscillator.start();

    oscillator.stop(
        audioContext.currentTime +
        duration
    );
}


/* ==========================================
   PLAYER
========================================== */

function setPlayerStart(){

    playerX =
        road.offsetLeft +
        road.clientWidth / 2;

    player.style.left =
        playerX + "px";
}


function movePlayer(x){

    const left =
        road.offsetLeft;

    const right =
        road.offsetLeft +
        road.clientWidth;

    const half =
        player.offsetWidth / 2;

    playerX = x;

    if(
        playerX <
        left + half
    ){

        playerX =
            left + half;
    }

    if(
        playerX >
        right - half
    ){

        playerX =
            right - half;
    }

    player.style.left =
        playerX + "px";
}


/* ==========================================
   TOUCH CONTROL
========================================== */

game.addEventListener(
    "touchstart",
    function(event){

        if(
            event.target.closest(
                "#menu"
            ) ||
            event.target.closest(
                "#pauseMenu"
            ) ||
            event.target.closest(
                "#pause"
            )
        ){

            return;
        }

        event.preventDefault();

        if(
            !running ||
            paused ||
            crashed
        ){

            return;
        }

        startAudio();

        lastTouchX =
            event.touches[0].clientX;

    },
    {passive:false}
);


game.addEventListener(
    "touchmove",
    function(event){

        if(
            event.target.closest(
                "#menu"
            ) ||
            event.target.closest(
                "#pauseMenu"
            )
        ){

            return;
        }

        event.preventDefault();

        if(
            !running ||
            paused ||
            crashed
        ){

            return;
        }

        const currentX =
            event.touches[0].clientX;

        const movement =
            currentX -
            lastTouchX;

        movePlayer(
            playerX +
            movement
        );

        lastTouchX =
            currentX;

    },
    {passive:false}
);


/* ==========================================
   ROAD LINES
========================================== */

function createRoadLines(){

    roadLines.forEach(
        line => line.remove()
    );

    roadLines = [];

    for(
        let i=0;
        i<9;
        i++
    ){

        const line =
            document.createElement(
                "div"
            );

        line.className =
            "roadLine";

        line.style.top =
            (i * 130 - 120) +
            "px";

        road.appendChild(line);

        roadLines.push(line);
    }
}


function updateRoad(delta){

    roadLines.forEach(
        function(line){

            let y =
                parseFloat(
                    line.style.top
                );

            y +=
                gameSpeed *
                delta;

            if(
                y >
                window.innerHeight
            ){

                y = -100;
            }

            line.style.top =
                y + "px";
        }
    );
}


/* ==========================================
   MOVING SIDE SCENERY
========================================== */

function createScenery(){

    const types = [
        "tree",
        "palm",
        "building",
        "bush"
    ];

    const type =
        types[
            Math.floor(
                Math.random() *
                types.length
            )
        ];

    let element;

    if(type === "tree"){

        element =
            document.createElement(
                "div"
            );

        element.className =
            "tree";

        element.innerHTML =
            '<div class="leaves"></div>' +
            '<div class="trunk"></div>';

    }

    if(type === "palm"){

        element =
            document.createElement(
                "div"
            );

        element.className =
            "palm";

        element.innerHTML =
            '<div class="palmTrunk"></div>' +
            '<div class="crown"></div>' +
            '<div class="leaf l1"></div>' +
            '<div class="leaf l2"></div>' +
            '<div class="leaf l3"></div>' +
            '<div class="leaf l4"></div>' +
            '<div class="leaf l5"></div>' +
            '<div class="leaf l6"></div>' +
            '<div class="coconut"></div>';
    }

    if(type === "building"){

        element =
            document.createElement(
                "div"
            );

        element.className =
            "building";

        element.innerHTML =
            '<div class="roof"></div>' +
            '<div class="buildingBody">' +
            '<div class="window w1"></div>' +
            '<div class="window w2"></div>' +
            '<div class="door"></div>' +
            '</div>';
    }

    if(type === "bush"){

        element =
            document.createElement(
                "div"
            );

        element.className =
            "bush";
    }


    const leftSide =
        Math.random() < .5;

    if(leftSide){

        element.style.left =
            (Math.random() * 5) +
            "%";

    }else{

        element.style.right =
            (Math.random() * 5) +
            "%";
    }

    element.style.top =
        "-190px";

    element.dataset.speed =
        gameSpeed *
        (.7 + Math.random() * .5);

    scenery.appendChild(element);

    sceneryObjects.push(element);
}


function updateScenery(delta){

    for(
        let i=sceneryObjects.length-1;
        i>=0;
        i--
    ){

        const object =
            sceneryObjects[i];

        let y =
            parseFloat(
                object.style.top
            );

        y +=
            parseFloat(
                object.dataset.speed
            ) *
            delta;

        object.style.top =
            y + "px";

        if(
            y >
            window.innerHeight + 200
        ){

            object.remove();

            sceneryObjects.splice(
                i,
                1
            );
        }
    }
}


/* ==========================================
   ENEMIES
========================================== */

function createEnemy(){

    const colors = [
        "green",
        "yellow",
        "blue",
        "white",
        "purple"
    ];

    const enemy =
        document.createElement(
            "div"
        );

    enemy.className =
        "enemy " +
        colors[
            Math.floor(
                Math.random() *
                colors.length
            )
        ];

    enemy.style.left =
        Math.random() *
        (road.clientWidth - 58) +
        "px";

    enemy.style.top =
        (-120 -
        Math.random() * 250) +
        "px";

    enemy.dataset.speed =
        gameSpeed *
        (.65 +
        Math.random() * .9);

    road.appendChild(enemy);

    enemies.push(enemy);
}


function updateEnemies(delta){

    for(
        let i=enemies.length-1;
        i>=0;
        i--
    ){

        const enemy =
            enemies[i];

        let y =
            parseFloat(
                enemy.style.top
            );

        y +=
            parseFloat(
                enemy.dataset.speed
            ) *
            delta;

        enemy.style.top =
            y + "px";

        if(
            isColliding(
                player,
                enemy
            )
        ){

            endGame();

            return;
        }

        if(
            y >
            window.innerHeight + 120
        ){

            enemy.remove();

            enemies.splice(
                i,
                1
            );

            score += 10;

            updateScore();
        }
    }
}


/* ==========================================
   COINS
========================================== */

function createCoin(){

    const coin =
        document.createElement(
            "div"
        );

    coin.className =
        "coin";

    coin.style.left =
        (
            15 +
            Math.random() *
            (road.clientWidth - 50)
        ) + "px";

    coin.style.top =
        (
            -60 -
            Math.random() * 150
        ) + "px";

    road.appendChild(coin);

    coinObjects.push(coin);
}


function updateCoins(delta){

    for(
        let i=coinObjects.length-1;
        i>=0;
        i--
    ){

        const coin =
            coinObjects[i];

        let y =
            parseFloat(
                coin.style.top
            );

        y +=
            gameSpeed *
            delta;

        coin.style.top =
            y + "px";

        if(
            isColliding(
                player,
                coin
            )
        ){

            const rect =
                coin.getBoundingClientRect();

            createCoinEffect(
                rect.left,
                rect.top
            );

            beep(
                900,
                .12,
                "square"
            );

            coin.remove();

            coinObjects.splice(
                i,
                1
            );

            totalCoins++;

            score += 25;

            coinsText.innerText =
                totalCoins;

            localStorage.setItem(
                "crazyRoadCoins",
                totalCoins
            );

            updateScore();

            continue;
        }

        if(
            y >
            window.innerHeight + 60
        ){

            coin.remove();

            coinObjects.splice(
                i,
                1
            );
        }
    }
}


/* ==========================================
   OBSTACLES
========================================== */

function createObstacle(){

    const object =
        document.createElement(
            "div"
        );

    if(
        Math.random() < .5
    ){

        object.className =
            "cone";

    }else{

        object.className =
            "obstacle";
    }

    object.style.left =
        (
            15 +
            Math.random() *
            (road.clientWidth - 70)
        ) + "px";

    object.style.top =
        (
            -80 -
            Math.random() * 200
        ) + "px";

    object.dataset.speed =
        gameSpeed *
        (.8 +
        Math.random() * .4);

    road.appendChild(object);

    obstacles.push(object);
}


function updateObstacles(delta){

    for(
        let i=obstacles.length-1;
        i>=0;
        i--
    ){

        const object =
            obstacles[i];

        let y =
            parseFloat(
                object.style.top
            );

        y +=
            parseFloat(
                object.dataset.speed
            ) *
            delta;

        object.style.top =
            y + "px";

        if(
            isColliding(
                player,
                object
            )
        ){

            endGame();

            return;
        }

        if(
            y >
            window.innerHeight + 100
        ){

            object.remove();

            obstacles.splice(
                i,
                1
            );

            score += 5;

            updateScore();
        }
    }
}


/* ==========================================
   COLLISION
========================================== */

function isColliding(a,b){

    const A =
        a.getBoundingClientRect();

    const B =
        b.getBoundingClientRect();

    return !(
        A.bottom < B.top ||
        A.top > B.bottom ||
        A.right < B.left ||
        A.left > B.right
    );
}


/* ==========================================
   SCORE / SPEED
========================================== */

function updateScore(){

    scoreText.innerText =
        score;

    const level =
        Math.floor(
            score / 500
        );

    const newSpeed =
        5 +
        level * 2;

    if(
        newSpeed !==
        gameSpeed
    ){

        gameSpeed =
            newSpeed;

        displaySpeed =
            100 +
            level * 30;

        speedText.innerText =
            displaySpeed;

        beep(
            600,
            .15,
            "sawtooth"
        );
    }
}


/* ==========================================
   EFFECTS
========================================== */

function createCoinEffect(x,y){

    const effect =
        document.createElement(
            "div"
        );

    effect.className =
        "coinPop";

    effect.innerText =
        "+25";

    effect.style.left =
        x + "px";

    effect.style.top =
        y + "px";

    game.appendChild(effect);

    setTimeout(
        function(){

            effect.remove();

        },
        700
    );
}


function createCrashEffect(){

    const effect =
        document.createElement(
            "div"
        );

    effect.className =
        "crash";

    effect.style.left =
        (playerX - 50) +
        "px";

    effect.style.top =
        (window.innerHeight - 180) +
        "px";

    game.appendChild(effect);

    setTimeout(
        function(){

            effect.remove();

        },
        600
    );
}


/* ==========================================
   GAME LOOP
========================================== */

function gameLoop(time){

    if(!running)
        return;

    if(paused){

        requestAnimationFrame(
            gameLoop
        );

        return;
    }

    if(!lastTime)
        lastTime = time;

    let delta =
        (time - lastTime) /
        16.67;

    if(delta > 2)
        delta = 2;

    lastTime = time;

    updateRoad(delta);

    updateScenery(delta);

    updateEnemies(delta);

    updateCoins(delta);

    updateObstacles(delta);


    /* ENEMIES */

    const enemyDelay =
        Math.max(
            450,
            1150 -
            score * .4
        );

    if(
        time - lastEnemy >
        enemyDelay +
        Math.random() * 700
    ){

        createEnemy();

        lastEnemy = time;
    }


    /* COINS */

    if(
        time - lastCoin >
        650 +
        Math.random() * 900
    ){

        createCoin();

        lastCoin = time;
    }


    /* OBSTACLES */

    if(
        score > 100 &&
        time - lastObstacle >
        1500 +
        Math.random() * 1500
    ){

        createObstacle();

        lastObstacle = time;
    }


    /* SCENERY */

    if(
        time - lastScenery >
        700 +
        Math.random() * 900
    ){

        createScenery();

        lastScenery = time;
    }


    requestAnimationFrame(
        gameLoop
    );
}


/* ==========================================
   START
========================================== */

function startGame(){

    startAudio();

    if(
        audioContext &&
        audioContext.state ===
        "suspended"
    ){

        audioContext.resume();
    }

    score = 0;

    gameSpeed = 5;

    displaySpeed = 100;

    running = true;

    paused = false;

    crashed = false;

    scoreText.innerText =
        "0";

    speedText.innerText =
        "100";

    menu.style.display =
        "none";

    pauseMenu.style.display =
        "none";

    pauseButton.style.display =
        "block";

    setPlayerStart();

    createRoadLines();

    lastEnemy =
        performance.now();

    lastCoin =
        performance.now();

    lastObstacle =
        performance.now();

    lastScenery =
        performance.now();

    lastTime = 0;

    beep(
        500,
        .15,
        "square"
    );

    requestAnimationFrame(
        gameLoop
    );
}


/* ==========================================
   GAME OVER
========================================== */

function endGame(){

    if(crashed)
        return;

    running = false;

    crashed = true;

    createCrashEffect();

    beep(
        100,
        .5,
        "sawtooth"
    );

    if(
        score > best
    ){

        best = score;

        localStorage.setItem(
            "crazyRoadBest",
            best
        );
    }

    bestText.innerText =
        best;

    menuBest.innerText =
        best;

    menuCoins.innerText =
        totalCoins;

    menuTitle.innerText =
        "💥 GAME OVER";

    menuSubtitle.innerText =
        "You survived the Crazy Road!";

    playButton.innerText =
        "🔄 PLAY AGAIN";

    menu.style.display =
        "flex";

    pauseButton.style.display =
        "none";

    enemies.forEach(
        x => x.remove()
    );

    coinObjects.forEach(
        x => x.remove()
    );

    obstacles.forEach(
        x => x.remove()
    );

    sceneryObjects.forEach(
        x => x.remove()
    );

    enemies = [];

    coinObjects = [];

    obstacles = [];

    sceneryObjects = [];
}


/* ==========================================
   PAUSE
========================================== */

pauseButton.addEventListener(
    "click",
    function(event){

        event.stopPropagation();

        if(
            !running ||
            crashed
        )
            return;

        paused = true;

        pauseMenu.style.display =
            "flex";
    }
);


/* ==========================================
   RESUME
========================================== */

resumeButton.addEventListener(
    "click",
    function(event){

        event.stopPropagation();

        paused = false;

        pauseMenu.style.display =
            "none";

        lastTime =
            performance.now();
    }
);


/* ==========================================
   QUIT
========================================== */

quitButton.addEventListener(
    "click",
    function(event){

        event.stopPropagation();

        running = false;

        paused = false;

        pauseMenu.style.display =
            "none";

        pauseButton.style.display =
            "none";

        menuTitle.innerText =
            "CRAZY ROAD";

        menuSubtitle.innerText =
            "2D HIGHWAY RACER";

        playButton.innerText =
            "▶ PLAY";

        menuBest.innerText =
            best;

        menuCoins.innerText =
            totalCoins;

        menu.style.display =
            "flex";
    }
);


/* ==========================================
   PLAY
========================================== */

playButton.addEventListener(
    "click",
    function(event){

        event.stopPropagation();

        startGame();
    }
);


/* ==========================================
   SOUND
========================================== */

soundButton.addEventListener(
    "click",
    function(event){

        event.stopPropagation();

        soundOn =
            !soundOn;

        if(soundOn){

            soundButton.innerText =
                "🔊 SOUND ON";

            startAudio();

        }else{

            soundButton.innerText =
                "🔇 SOUND OFF";
        }
    }
);


/* ==========================================
   RESIZE
========================================== */

window.addEventListener(
    "resize",
    function(){

        if(!running){

            setPlayerStart();

        }else{

            movePlayer(playerX);
        }
    }
);


/* ==========================================
   INITIALIZE
========================================== */

setPlayerStart();

createRoadLines();

</script>

</body>
</html>
