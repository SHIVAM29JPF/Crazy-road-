<!DOCTYPE html>
<html>
<head>
<meta name="viewport"
content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>Crazy Road V3.1</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#55ad4e;
  font-family:Arial,sans-serif;
  touch-action:none;
}

#game{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;
  background:#55ad4e;
}

/* ================= ROAD ================= */

#road{
  position:absolute;
  left:8%;
  width:84%;
  height:100%;
  background:
    linear-gradient(
      90deg,
      #222 0%,
      #3c3c3c 9%,
      #303030 50%,
      #3c3c3c 91%,
      #222 100%
    );
  border-left:5px solid white;
  border-right:5px solid white;
  overflow:hidden;
  z-index:5;
}

.roadLine{
  position:absolute;
  width:7px;
  height:85px;
  left:50%;
  transform:translateX(-50%);
  background:white;
  border-radius:5px;
}

/* ================= SCENERY ================= */

#scenery{
  position:absolute;
  inset:0;
  overflow:hidden;
  pointer-events:none;
  z-index:2;
}

.grass{
  position:absolute;
  inset:0;
  background:
    repeating-linear-gradient(
      90deg,
      rgba(0,70,0,.09) 0 2px,
      transparent 2px 24px
    );
}

/* Trees */

.tree{
  position:absolute;
  width:70px;
  height:115px;
}

.treeLeaves{
  position:absolute;
  width:62px;
  height:62px;
  left:4px;
  top:2px;
  background:#16802a;
  border-radius:50%;
  box-shadow:
    -16px 18px 0 #229d38,
    17px 20px 0 #126a21,
    0 31px 0 #1a8c2f;
}

.treeTrunk{
  position:absolute;
  width:16px;
  height:65px;
  left:27px;
  bottom:0;
  background:linear-gradient(
    90deg,#4c2c15,#a36a31,#4d2b14
  );
  border-radius:5px;
}

/* Palm */

.palm{
  position:absolute;
  width:100px;
  height:160px;
}

.palmTrunk{
  position:absolute;
  width:13px;
  height:120px;
  left:44px;
  bottom:0;
  background:linear-gradient(
    90deg,#533015,#ad7434,#543115
  );
  border-radius:50%;
}

.palmCenter{
  position:absolute;
  left:38px;
  top:22px;
  width:23px;
  height:23px;
  background:#583217;
  border-radius:50%;
  z-index:2;
}

.palmLeaf{
  position:absolute;
  left:49px;
  top:29px;
  width:67px;
  height:10px;
  background:#146e25;
  border-radius:100% 0 100% 0;
  transform-origin:left center;
}

.pl1{transform:rotate(-15deg)}
.pl2{transform:rotate(18deg)}
.pl3{transform:rotate(48deg)}
.pl4{transform:rotate(-48deg)}
.pl5{transform:rotate(82deg)}
.pl6{transform:rotate(-82deg)}

.coconut{
  position:absolute;
  left:39px;
  top:37px;
  width:12px;
  height:12px;
  background:#6b3c18;
  border-radius:50%;
  z-index:3;
}

/* Building */

.building{
  position:absolute;
  width:100px;
  height:145px;
}

.roof{
  position:absolute;
  width:100px;
  height:38px;
  top:0;
  background:#8b3027;
  clip-path:polygon(
    50% 0,
    100% 100%,
    0 100%
  );
}

.buildingBody{
  position:absolute;
  width:84px;
  height:115px;
  left:8px;
  bottom:0;
  background:linear-gradient(
    90deg,#999,#eee,#aaa
  );
  border:3px solid #666;
}

.window{
  position:absolute;
  width:18px;
  height:25px;
  background:#69d9ef;
  border:2px solid #444;
}

.w1{
  left:18px;
  bottom:48px;
}

.w2{
  right:18px;
  bottom:48px;
}

.door{
  position:absolute;
  width:23px;
  height:43px;
  left:29px;
  bottom:0;
  background:#70462e;
  border:2px solid #49301f;
}

/* ================= F1 PLAYER ================= */

/*
   IMPORTANT:
   The car is now higher above the bottom,
   leaving a dedicated area for the Nitro bar.
*/

#car{
  position:absolute;
  width:82px;
  height:125px;
  bottom:105px;
  transform:translateX(-50%);
  z-index:150;
  filter:drop-shadow(0 7px 6px rgba(0,0,0,.75));
}

.f1RearWing{
  position:absolute;
  left:-5px;
  bottom:5px;
  width:92px;
  height:11px;
  background:#111;
  border-radius:4px;
  border:2px solid #555;
}

.f1RearSupport1,
.f1RearSupport2{
  position:absolute;
  width:5px;
  height:13px;
  background:#111;
  bottom:10px;
}

.f1RearSupport1{left:25px}
.f1RearSupport2{right:25px}

.f1Body{
  position:absolute;
  left:22px;
  top:13px;
  width:38px;
  height:101px;
  background:
    linear-gradient(
      90deg,
      #700000,
      #f51a1a 28%,
      #ff3838 50%,
      #c50000 72%,
      #690000
    );
  clip-path:polygon(
    50% 0,
    70% 15%,
    82% 42%,
    100% 55%,
    79% 66%,
    72% 91%,
    63% 100%,
    37% 100%,
    28% 91%,
    21% 66%,
    0 55%,
    18% 42%,
    30% 15%
  );
  border:2px solid #ff6d6d;
}

.f1Nose{
  position:absolute;
  left:34px;
  top:0;
  width:14px;
  height:34px;
  background:#e00000;
  clip-path:polygon(
    50% 0,
    100% 100%,
    0 100%
  );
  z-index:3;
}

.f1FrontWing{
  position:absolute;
  left:4px;
  top:25px;
  width:74px;
  height:9px;
  background:#101010;
  border-radius:5px;
  z-index:4;
}

.f1FrontWing:before,
.f1FrontWing:after{
  content:"";
  position:absolute;
  width:17px;
  height:5px;
  background:#555;
  top:2px;
}

.f1FrontWing:before{left:-7px}
.f1FrontWing:after{right:-7px}

.f1Cockpit{
  position:absolute;
  left:27px;
  top:39px;
  width:28px;
  height:37px;
  background:
    linear-gradient(
      135deg,
      #050505,
      #647680 48%,
      #080808
    );
  border:2px solid #111;
  border-radius:13px 13px 9px 9px;
  z-index:5;
}

.f1Cockpit:after{
  content:"";
  position:absolute;
  width:4px;
  height:30px;
  left:10px;
  top:1px;
  background:#333;
  border-radius:3px;
}

.halo{
  position:absolute;
  left:25px;
  top:37px;
  width:32px;
  height:41px;
  border:3px solid #d0d0d0;
  border-radius:50%;
  z-index:6;
}

.sidePod{
  position:absolute;
  width:17px;
  height:47px;
  top:57px;
  background:
    linear-gradient(
      90deg,#790000,#e51616,#720000
    );
  border-radius:8px;
  z-index:2;
}

.sideLeft{left:8px}
.sideRight{right:8px}

.f1Wheel{
  position:absolute;
  width:12px;
  height:31px;
  background:#080808;
  border:2px solid #444;
  border-radius:5px;
  z-index:1;
}

.f1wl1{left:2px;top:35px}
.f1wr1{right:2px;top:35px}
.f1wl2{left:5px;bottom:19px}
.f1wr2{right:5px;bottom:19px}

.f1Stripe{
  position:absolute;
  left:39px;
  top:17px;
  width:5px;
  height:91px;
  background:white;
  border-radius:3px;
  z-index:7;
  opacity:.9;
}

/* ================= TRAFFIC CARS ================= */

.traffic{
  position:absolute;
  width:68px;
  height:112px;
  z-index:25;
  filter:drop-shadow(
    0 5px 5px rgba(0,0,0,.7)
  );
}

.trafficBody{
  position:absolute;
  left:7px;
  top:4px;
  width:54px;
  height:104px;
  border-radius:18px 18px 13px 13px;
  border:2px solid rgba(255,255,255,.55);
  box-shadow:
    inset 5px 0 7px rgba(255,255,255,.18),
    inset -5px 0 7px rgba(0,0,0,.25);
}

.trafficRoof{
  position:absolute;
  left:15px;
  top:24px;
  width:38px;
  height:52px;
  background:
    linear-gradient(
      90deg,#111,#596b73 48%,#111
    );
  border-radius:12px;
  border:2px solid #171717;
  z-index:4;
}

.windshieldFront{
  position:absolute;
  left:19px;
  top:27px;
  width:30px;
  height:17px;
  background:
    linear-gradient(
      135deg,#111,#9ac4ce,#111
    );
  border-radius:8px 8px 3px 3px;
  z-index:5;
}

.windshieldRear{
  position:absolute;
  left:19px;
  top:56px;
  width:30px;
  height:15px;
  background:
    linear-gradient(
      135deg,#111,#738d95,#111
    );
  border-radius:3px 3px 8px 8px;
  z-index:5;
}

.trafficWheel{
  position:absolute;
  width:11px;
  height:27px;
  background:#090909;
  border:2px solid #4e4e4e;
  border-radius:5px;
  z-index:2;
}

.tw1{left:0;top:27px}
.tw2{right:0;top:27px}
.tw3{left:0;bottom:23px}
.tw4{right:0;bottom:23px}

.headLight{
  position:absolute;
  width:9px;
  height:6px;
  background:#fffbd0;
  border-radius:3px;
  top:9px;
  z-index:6;
  box-shadow:0 0 5px #fff;
}

.hl1{left:16px}
.hl2{right:16px}

.tailLight{
  position:absolute;
  width:8px;
  height:5px;
  background:#ff1515;
  border-radius:3px;
  bottom:8px;
  z-index:6;
}

.tl1{left:15px}
.tl2{right:15px}

.carGreen{
  background:linear-gradient(
    90deg,#075b12,#20bd35,#075b12
  );
}

.carYellow{
  background:linear-gradient(
    90deg,#9c7200,#ffd51a,#9c7200
  );
}

.carBlue{
  background:linear-gradient(
    90deg,#00357f,#167cff,#00357f
  );
}

.carWhite{
  background:linear-gradient(
    90deg,#777,#f8f8f8,#999
  );
}

.carPurple{
  background:linear-gradient(
    90deg,#4b0879,#b735e8,#4b0879
  );
}

/* ================= COINS ================= */

.coin{
  position:absolute;
  width:35px;
  height:35px;
  border-radius:50%;
  background:
    radial-gradient(
      circle,
      #fff46b 0%,
      #ffd000 42%,
      #ee9700 78%,
      #9b5500 100%
    );
  border:3px solid #ffe55a;
  box-shadow:0 0 12px #ffd000;
  z-index:30;
  animation:coinSpin .6s linear infinite;
}

.coin:after{
  content:"★";
  position:absolute;
  color:white;
  font-size:18px;
  left:6px;
  top:3px;
}

@keyframes coinSpin{
  from{transform:rotateY(0deg)}
  to{transform:rotateY(360deg)}
}

/* ================= OBSTACLES ================= */

.obstacle{
  position:absolute;
  width:58px;
  height:38px;
  background:
    repeating-linear-gradient(
      135deg,
      #ff7200 0 9px,
      #222 9px 18px
    );
  border:3px solid white;
  border-radius:7px;
  z-index:19;
}

.cone{
  position:absolute;
  width:28px;
  height:42px;
  background:
    linear-gradient(
      90deg,#b53a00,#ff6b00,#b53a00
    );
  clip-path:polygon(
    50% 0,
    100% 100%,
    0 100%
  );
  z-index:19;
}

/* ================= HUD ================= */

#hud{
  position:absolute;
  top:12px;
  left:12px;
  z-index:200;
  color:white;
  background:rgba(0,0,0,.68);
  padding:8px 12px;
  border-radius:13px;
  font-size:15px;
  line-height:1.5;
  font-weight:bold;
  text-shadow:2px 2px 3px #000;
  pointer-events:none;
}

#speedText{
  color:#ffe000;
}

#livesText{
  color:#ff4a4a;
}

/* ================= NITRO ================= */

/*
   NITRO IS NOW ABOVE THE BOTTOM EDGE
   AND ABOVE THE GAME OBJECTS.
*/

#nitro{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  bottom:22px;
  z-index:300;
  width:min(190px,55vw);
  height:42px;
  border:2px solid white;
  border-radius:20px;
  background:rgba(0,0,0,.82);
  overflow:hidden;
  box-shadow:0 3px 12px rgba(0,0,0,.7);
  pointer-events:none;
}

#nitroBar{
  position:absolute;
  left:0;
  top:0;
  height:100%;
  width:100%;
  background:
    linear-gradient(
      90deg,#ff6500,#ffe000
    );
}

#nitroText{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  font-weight:bold;
  font-size:14px;
  text-shadow:2px 2px 3px #000;
}

/* ================= FLAME ================= */

.nitroFlame{
  position:absolute;
  width:14px;
  height:33px;
  left:34px;
  bottom:-29px;
  background:
    linear-gradient(
      #fff,
      #ffe000 35%,
      #ff4500 75%,
      transparent
    );
  border-radius:50%;
  z-index:-1;
  animation:flame .1s infinite alternate;
}

@keyframes flame{
  from{transform:scaleY(.7)}
  to{transform:scaleY(1.25)}
}

/* ================= PAUSE ================= */

#pause{
  position:absolute;
  right:14px;
  top:14px;
  z-index:250;
  width:48px;
  height:48px;
  border-radius:50%;
  border:2px solid white;
  background:rgba(0,0,0,.7);
  color:white;
  font-size:22px;
  display:none;
}

/* ================= MENU ================= */

#menu{
  position:absolute;
  inset:0;
  z-index:500;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  background:rgba(0,0,0,.68);
}

.panel{
  width:86%;
  max-width:370px;
  padding:28px 20px;
  border-radius:25px;
  background:rgba(10,10,10,.95);
  color:white;
  box-shadow:0 10px 40px rgba(0,0,0,.8);
}

.title{
  font-size:38px;
  font-weight:900;
  color:#ff2020;
  text-shadow:3px 3px 0 #600;
}

.subtitle{
  color:#ddd;
  margin:7px 0 20px;
}

.stat{
  font-size:20px;
  margin:8px;
}

.mainButton{
  width:90%;
  padding:15px;
  margin-top:18px;
  border:0;
  border-radius:14px;
  background:#e81717;
  color:white;
  font-size:22px;
  font-weight:bold;
  box-shadow:0 5px 0 #850000;
}

.soundButton,
.smallButton{
  margin-top:15px;
  padding:11px 18px;
  border:0;
  border-radius:12px;
  background:#333;
  color:white;
  font-size:16px;
}

/* ================= COUNTDOWN ================= */

#countdown{
  position:absolute;
  inset:0;
  z-index:450;
  display:none;
  align-items:center;
  justify-content:center;
  color:white;
  font-size:90px;
  font-weight:900;
  text-shadow:
    5px 5px 0 #000,
    0 0 30px #ff2222;
}

/* ================= PAUSE MENU ================= */

#pauseMenu{
  position:absolute;
  inset:0;
  z-index:475;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.68);
  color:white;
  text-align:center;
}

.pauseBox{
  background:rgba(0,0,0,.94);
  padding:30px;
  border-radius:22px;
}

.smallButton{
  padding:13px 25px;
  margin:7px;
  font-size:18px;
}

/* ================= EFFECTS ================= */

.crash{
  position:absolute;
  width:100px;
  height:100px;
  border-radius:50%;
  border:6px solid #ffb000;
  box-shadow:
    0 0 20px #ff6500,
    0 0 40px red;
  animation:crashAnimation .5s ease-out forwards;
  z-index:600;
}

@keyframes crashAnimation{
  from{
    transform:scale(.2);
    opacity:1;
  }
  to{
    transform:scale(2);
    opacity:0;
  }
}

.coinPop{
  position:absolute;
  color:#ffe000;
  font-size:22px;
  font-weight:bold;
  z-index:600;
  animation:coinAnimation .7s ease-out forwards;
}

@keyframes coinAnimation{
  from{
    transform:translateY(0) scale(.5);
    opacity:1;
  }
  to{
    transform:translateY(-60px) scale(1.4);
    opacity:0;
  }
}

/* Small phones */

@media(max-width:420px){

  #car{
    width:76px;
    height:118px;
    bottom:105px;
  }

  #hud{
    font-size:14px;
  }

  #nitro{
    width:165px;
    height:40px;
    bottom:18px;
  }

  #nitroText{
    font-size:12px;
  }

  .title{
    font-size:34px;
  }
}
</style>
</head>

<body>

<div id="game">

<!-- ================= SCENERY ================= -->

<div id="scenery">

  <div class="grass"></div>

  <div class="tree" style="left:1%;top:13%">
    <div class="treeLeaves"></div>
    <div class="treeTrunk"></div>
  </div>

  <div class="tree" style="right:1%;top:42%">
    <div class="treeLeaves"></div>
    <div class="treeTrunk"></div>
  </div>

  <div class="palm" style="left:-2%;top:65%">
    <div class="palmTrunk"></div>
    <div class="palmCenter"></div>
    <div class="palmLeaf pl1"></div>
    <div class="palmLeaf pl2"></div>
    <div class="palmLeaf pl3"></div>
    <div class="palmLeaf pl4"></div>
    <div class="palmLeaf pl5"></div>
    <div class="palmLeaf pl6"></div>
    <div class="coconut"></div>
  </div>

  <div class="building" style="right:0%;top:8%">
    <div class="roof"></div>

    <div class="buildingBody">
      <div class="window w1"></div>
      <div class="window w2"></div>
      <div class="door"></div>
    </div>
  </div>

</div>

<!-- ================= ROAD ================= -->

<div id="road"></div>

<!-- ================= HUD ================= -->

<div id="hud">
🏆 Score: <span id="score">0</span><br>
🥇 Best: <span id="best">0</span><br>
🪙 Coins: <span id="coins">0</span><br>
❤️ Lives: <span id="livesText">3</span><br>
⚡ <span id="speedText">100</span> km/h
</div>

<!-- ================= NITRO ================= -->

<div id="nitro">
  <div id="nitroBar"></div>
  <div id="nitroText">
    🔥 NITRO — SWIPE UP
  </div>
</div>

<button id="pause">Ⅱ</button>

<div id="countdown"></div>

<!-- ================= PLAYER ================= -->

<div id="car">

  <div class="f1RearWing"></div>

  <div class="f1RearSupport1"></div>
  <div class="f1RearSupport2"></div>

  <div class="f1Wheel f1wl1"></div>
  <div class="f1Wheel f1wr1"></div>

  <div class="f1Wheel f1wl2"></div>
  <div class="f1Wheel f1wr2"></div>

  <div class="sidePod sideLeft"></div>
  <div class="sidePod sideRight"></div>

  <div class="f1Body"></div>

  <div class="f1Nose"></div>

  <div class="f1FrontWing"></div>

  <div class="f1Cockpit"></div>

  <div class="halo"></div>

  <div class="f1Stripe"></div>

</div>

<!-- ================= MENU ================= -->

<div id="menu">

  <div class="panel">

    <div class="title" id="menuTitle">
      CRAZY ROAD
    </div>

    <div class="subtitle" id="menuSubtitle">
      V3.1 — TOP-DOWN F1 RACER
    </div>

    <div class="stat">
      🥇 Best:
      <span id="menuBest">0</span>
    </div>

    <div class="stat">
      🪙 Coins:
      <span id="menuCoins">0</span>
    </div>

    <button class="mainButton" id="playButton">
      ▶ PLAY
    </button>

    <br>

    <button class="soundButton" id="soundButton">
      🔊 SOUND ON
    </button>

  </div>

</div>

<!-- ================= PAUSE ================= -->

<div id="pauseMenu">

  <div class="pauseBox">

    <h1>⏸️ PAUSED</h1>

    <button class="smallButton" id="resumeButton">
      ▶ Resume
    </button>

    <button class="smallButton" id="quitButton">
      🏠 Menu
    </button>

  </div>

</div>

</div>

<script>

/* ================= ELEMENTS ================= */

const game =
document.getElementById("game");

const road =
document.getElementById("road");

const player =
document.getElementById("car");

const menu =
document.getElementById("menu");

const pauseButton =
document.getElementById("pause");

const pauseMenu =
document.getElementById("pauseMenu");

const countdown =
document.getElementById("countdown");

const playButton =
document.getElementById("playButton");

const resumeButton =
document.getElementById("resumeButton");

const quitButton =
document.getElementById("quitButton");

const soundButton =
document.getElementById("soundButton");

const scoreText =
document.getElementById("score");

const bestText =
document.getElementById("best");

const coinsText =
document.getElementById("coins");

const livesText =
document.getElementById("livesText");

const speedText =
document.getElementById("speedText");

const nitroBar =
document.getElementById("nitroBar");

const menuBest =
document.getElementById("menuBest");

const menuCoins =
document.getElementById("menuCoins");

const menuTitle =
document.getElementById("menuTitle");

const menuSubtitle =
document.getElementById("menuSubtitle");


/* ================= VARIABLES ================= */

let playerX=0;

let score=0;

let best=
Number(localStorage.getItem(
"crazyRoadBest"
))||0;

let totalCoins=
Number(localStorage.getItem(
"crazyRoadCoins"
))||0;

let lives=3;

let gameSpeed=5;

let displaySpeed=100;

let running=false;

let paused=false;

let crashed=false;

let soundOn=true;

let nitro=100;

let nitroActive=false;

let enemies=[];

let coinObjects=[];

let obstacles=[];

let roadLines=[];

let sceneryObjects=[];

let lastEnemy=0;

let lastCoin=0;

let lastObstacle=0;

let lastScenery=0;

let lastTime=0;

let touchStartY=0;

let lastTouchX=0;

let audioContext=null;


/* ================= INITIAL ================= */

bestText.innerText=best;

coinsText.innerText=totalCoins;

menuBest.innerText=best;

menuCoins.innerText=totalCoins;


/* ================= AUDIO ================= */

function startAudio(){

  if(!soundOn)return;

  if(audioContext)return;

  try{

    audioContext=
    new(
      window.AudioContext||
      window.webkitAudioContext
    )();

  }catch(e){}
}

function beep(
frequency,
duration,
type="sine"
){

  if(!soundOn||!audioContext)return;

  const oscillator=
  audioContext.createOscillator();

  const gain=
  audioContext.createGain();

  oscillator.type=type;

  oscillator.frequency.value=
  frequency;

  gain.gain.setValueAtTime(
    .08,
    audioContext.currentTime
  );

  gain.gain.exponentialRampToValueAtTime(
    .001,
    audioContext.currentTime+
    duration
  );

  oscillator.connect(gain);

  gain.connect(
    audioContext.destination
  );

  oscillator.start();

  oscillator.stop(
    audioContext.currentTime+
    duration
  );
}


/* ================= PLAYER ================= */

function setPlayerStart(){

  playerX=
  road.offsetLeft+
  road.clientWidth/2;

  player.style.left=
  playerX+"px";
}

function movePlayer(x){

  const left=
  road.offsetLeft;

  const right=
  road.offsetLeft+
  road.clientWidth;

  const half=
  player.offsetWidth/2;

  playerX=x;

  if(
    playerX<
    left+half
  ){
    playerX=
    left+half;
  }

  if(
    playerX>
    right-half
  ){
    playerX=
    right-half;
  }

  player.style.left=
  playerX+"px";
}


/* ================= SWIPE ================= */

game.addEventListener(
"touchstart",
function(e){

  if(
    e.target.closest("#menu")||
    e.target.closest("#pauseMenu")||
    e.target.closest("#pause")
  ){
    return;
  }

  if(
    !running||
    paused||
    crashed
  ){
    return;
  }

  e.preventDefault();

  startAudio();

  lastTouchX=
  e.touches[0].clientX;

  touchStartY=
  e.touches[0].clientY;

},
{passive:false}
);

game.addEventListener(
"touchmove",
function(e){

  if(
    !running||
    paused||
    crashed
  ){
    return;
  }

  e.preventDefault();

  const x=
  e.touches[0].clientX;

  const y=
  e.touches[0].clientY;

  const dx=
  x-lastTouchX;

  movePlayer(
    playerX+dx
  );

  lastTouchX=x;

  if(
    touchStartY-y>60&&
    nitro>10
  ){

    activateNitro();

    touchStartY=y;
  }

},
{passive:false}
);


/* ================= ROAD ================= */

function createRoadLines(){

  roadLines.forEach(
    x=>x.remove()
  );

  roadLines=[];

  for(
    let i=0;
    i<9;
    i++
  ){

    const line=
    document.createElement("div");

    line.className="roadLine";

    line.style.top=
    (i*130-120)+"px";

    road.appendChild(line);

    roadLines.push(line);
  }
}

function updateRoad(delta){

  roadLines.forEach(
  line=>{

    let y=
    parseFloat(
      line.style.top
    );

    y+=
    gameSpeed*
    delta*
    (nitroActive?1.8:1);

    if(
      y>window.innerHeight
    ){
      y=-100;
    }

    line.style.top=
    y+"px";
  });
}


/* ================= TRAFFIC ================= */

function createEnemy(){

  const colors=[
    "carGreen",
    "carYellow",
    "carBlue",
    "carWhite",
    "carPurple"
  ];

  const enemy=
  document.createElement("div");

  enemy.className="traffic";

  enemy.innerHTML=

  '<div class="trafficBody '+
  colors[
    Math.floor(
      Math.random()*colors.length
    )
  ]+'"></div>'+

  '<div class="trafficWheel tw1"></div>'+
  '<div class="trafficWheel tw2"></div>'+
  '<div class="trafficWheel tw3"></div>'+
  '<div class="trafficWheel tw4"></div>'+

  '<div class="trafficRoof"></div>'+

  '<div class="windshieldFront"></div>'+
  '<div class="windshieldRear"></div>'+

  '<div class="headLight hl1"></div>'+
  '<div class="headLight hl2"></div>'+

  '<div class="tailLight tl1"></div>'+
  '<div class="tailLight tl2"></div>';

  enemy.style.left=
  (
    10+
    Math.random()*
    (road.clientWidth-70)
  )+"px";

  enemy.style.top=
  (
    -150-
    Math.random()*250
  )+"px";

  enemy.dataset.speed=
  gameSpeed*
  (.65+Math.random()*.75);

  road.appendChild(enemy);

  enemies.push(enemy);
}

function updateEnemies(delta){

  for(
    let i=enemies.length-1;
    i>=0;
    i--
  ){

    const enemy=
    enemies[i];

    let y=
    parseFloat(
      enemy.style.top
    );

    y+=
    parseFloat(
      enemy.dataset.speed
    )*
    delta*
    (nitroActive?1.5:1);

    enemy.style.top=
    y+"px";

    if(
      isColliding(
        player,
        enemy
      )
    ){

      hitPlayer(enemy);

      return;
    }

    if(
      y>
      window.innerHeight+150
    ){

      enemy.remove();

      enemies.splice(i,1);

      score+=10;

      updateScore();
    }
  }
}


/* ================= COINS ================= */

function createCoin(){

  const coin=
  document.createElement("div");

  coin.className="coin";

  coin.style.left=
  (
    15+
    Math.random()*
    (road.clientWidth-50)
  )+"px";

  coin.style.top=
  (
    -70-
    Math.random()*180
  )+"px";

  road.appendChild(coin);

  coinObjects.push(coin);
}

function updateCoins(delta){

  for(
    let i=coinObjects.length-1;
    i>=0;
    i--
  ){

    const coin=
    coinObjects[i];

    let y=
    parseFloat(
      coin.style.top
    );

    y+=
    gameSpeed*
    delta*
    (nitroActive?1.6:1);

    coin.style.top=
    y+"px";

    if(
      isColliding(
        player,
        coin
      )
    ){

      const rect=
      coin.getBoundingClientRect();

      createCoinEffect(
        rect.left,
        rect.top
      );

      beep(
        900,
        .12,
        "square"
      );

      coin.remove();

      coinObjects.splice(i,1);

      totalCoins++;

      score+=25;

      coinsText.innerText=
      totalCoins;

      localStorage.setItem(
        "crazyRoadCoins",
        totalCoins
      );

      updateScore();

      continue;
    }

    if(
      y>
      window.innerHeight+70
    ){

      coin.remove();

      coinObjects.splice(i,1);
    }
  }
}


/* ================= OBSTACLES ================= */

function createObstacle(){

  const object=
  document.createElement("div");

  if(Math.random()<.5){

    object.className="cone";

  }else{

    object.className="obstacle";
  }

  object.style.left=
  (
    15+
    Math.random()*
    (road.clientWidth-70)
  )+"px";

  object.style.top=
  (
    -100-
    Math.random()*200
  )+"px";

  object.dataset.speed=
  gameSpeed*
  (.8+Math.random()*.4);

  road.appendChild(object);

  obstacles.push(object);
}

function updateObstacles(delta){

  for(
    let i=obstacles.length-1;
    i>=0;
    i--
  ){

    const object=
    obstacles[i];

    let y=
    parseFloat(
      object.style.top
    );

    y+=
    parseFloat(
      object.dataset.speed
    )*
    delta;

    object.style.top=
    y+"px";

    if(
      isColliding(
        player,
        object
      )
    ){

      hitPlayer(object);

      return;
    }

    if(
      y>
      window.innerHeight+100
    ){

      object.remove();

      obstacles.splice(i,1);

      score+=5;

      updateScore();
    }
  }
}


/* ================= SCENERY ================= */

function createScenery(){

  const type=
  Math.random()<.5?
  "tree":"palm";

  const object=
  document.createElement("div");

  if(type==="tree"){

    object.className="tree";

    object.innerHTML=
    '<div class="treeLeaves"></div>'+
    '<div class="treeTrunk"></div>';

  }else{

    object.className="palm";

    object.innerHTML=
    '<div class="palmTrunk"></div>'+
    '<div class="palmCenter"></div>'+
    '<div class="palmLeaf pl1"></div>'+
    '<div class="palmLeaf pl2"></div>'+
    '<div class="palmLeaf pl3"></div>'+
    '<div class="palmLeaf pl4"></div>'+
    '<div class="palmLeaf pl5"></div>'+
    '<div class="palmLeaf pl6"></div>'+
    '<div class="coconut"></div>';
  }

  if(Math.random()<.5){

    object.style.left=
    (Math.random()*4)+"%";

  }else{

    object.style.right=
    (Math.random()*4)+"%";
  }

  object.style.top="-190px";

  object.dataset.speed=
  gameSpeed*
  (.7+Math.random()*.5);

  document
  .getElementById("scenery")
  .appendChild(object);

  sceneryObjects.push(object);
}

function updateScenery(delta){

  for(
    let i=sceneryObjects.length-1;
    i>=0;
    i--
  ){

    const object=
    sceneryObjects[i];

    let y=
    parseFloat(
      object.style.top
    );

    y+=
    parseFloat(
      object.dataset.speed
    )*
    delta;

    object.style.top=
    y+"px";

    if(
      y>
      window.innerHeight+220
    ){

      object.remove();

      sceneryObjects.splice(i,1);
    }
  }
}


/* ================= COLLISION ================= */

function isColliding(a,b){

  const A=
  a.getBoundingClientRect();

  const B=
  b.getBoundingClientRect();

  const padding=9;

  return !(
    A.right-padding<
    B.left+padding||

    A.left+padding>
    B.right-padding||

    A.bottom-padding<
    B.top+padding||

    A.top+padding>
    B.bottom-padding
  );
}


/* ================= HIT ================= */

function hitPlayer(object){

  if(
    object&&
    object.parentNode
  ){
    object.remove();
  }

  lives--;

  livesText.innerText=
  lives;

  createCrashEffect();

  beep(
    120,
    .35,
    "sawtooth"
  );

  if(lives<=0){

    endGame();

    return;
  }

  player.style.opacity=".35";

  setTimeout(
  function(){

    player.style.opacity="1";

  },
  1400
  );
}


/* ================= SCORE ================= */

function updateScore(){

  scoreText.innerText=
  score;

  const level=
  Math.floor(score/500);

  gameSpeed=
  5+
  level*1.25;

  displaySpeed=
  Math.round(
    100+
    level*22
  );

  speedText.innerText=
  displaySpeed;
}


/* ================= NITRO ================= */

function activateNitro(){

  if(
    nitroActive||
    nitro<10||
    !running||
    paused
  ){
    return;
  }

  nitroActive=true;

  const flame=
  document.createElement("div");

  flame.className=
  "nitroFlame";

  player.appendChild(flame);

  beep(
    250,
    .2,
    "sawtooth"
  );

  const timer=
  setInterval(
  function(){

    nitro-=1.5;

    nitroBar.style.width=
    Math.max(
      0,nitro
    )+"%";

    if(nitro<=0){

      nitroActive=false;

      clearInterval(timer);

      flame.remove();
    }

  },
  50
  );

  setTimeout(
  function(){

    nitroActive=false;

    clearInterval(timer);

    if(flame.parentNode){
      flame.remove();
    }

  },
  3500
  );
}

function rechargeNitro(delta){

  if(
    !nitroActive&&
    nitro<100
  ){

    nitro+=
    .025*delta;

    if(nitro>100)
      nitro=100;

    nitroBar.style.width=
    nitro+"%";
  }
}


/* ================= EFFECTS ================= */

function createCrashEffect(){

  const effect=
  document.createElement("div");

  effect.className="crash";

  effect.style.left=
  (playerX-50)+"px";

  effect.style.top=
  (
    window.innerHeight-210
  )+"px";

  game.appendChild(effect);

  setTimeout(
    ()=>effect.remove(),
    600
  );
}

function createCoinEffect(x,y){

  const effect=
  document.createElement("div");

  effect.className="coinPop";

  effect.innerText="+25";

  effect.style.left=x+"px";

  effect.style.top=y+"px";

  game.appendChild(effect);

  setTimeout(
    ()=>effect.remove(),
    700
  );
}


/* ================= COUNTDOWN ================= */

function startCountdown(){

  return new Promise(
  resolve=>{

    let number=3;

    countdown.style.display=
    "flex";

    countdown.innerText=
    number;

    const timer=
    setInterval(
    function(){

      number--;

      if(number>0){

        countdown.innerText=
        number;

        beep(
          400,
          .12,
          "square"
        );

      }else{

        countdown.innerText="GO!";

        beep(
          800,
          .2,
          "square"
        );

        setTimeout(
        function(){

          countdown.style.display=
          "none";

          clearInterval(timer);

          resolve();

        },
        600
        );
      }

    },
    700
    );
  });
}


/* ================= GAME LOOP ================= */

function gameLoop(time){

  if(!running)return;

  if(paused){

    requestAnimationFrame(
      gameLoop
    );

    return;
  }

  if(!lastTime)
    lastTime=time;

  let delta=
  (time-lastTime)/16.67;

  if(delta>2)
    delta=2;

  lastTime=time;

  updateRoad(delta);

  updateScenery(delta);

  updateEnemies(delta);

  updateCoins(delta);

  updateObstacles(delta);

  rechargeNitro(delta);

  const enemyDelay=
  Math.max(
    800,
    1600-score*.22
  );

  if(
    time-lastEnemy>
    enemyDelay+
    Math.random()*900
  ){

    createEnemy();

    lastEnemy=time;
  }

  if(
    time-lastCoin>
    750+
    Math.random()*1000
  ){

    createCoin();

    lastCoin=time;
  }

  /* Very few obstacles */

  if(
    score>250&&
    time-lastObstacle>
    4000+
    Math.random()*3500
  ){

    createObstacle();

    lastObstacle=time;
  }

  if(
    time-lastScenery>
    700+
    Math.random()*700
  ){

    createScenery();

    lastScenery=time;
  }

  requestAnimationFrame(
    gameLoop
  );
}


/* ================= START ================= */

async function startGame(){

  startAudio();

  if(
    audioContext&&
    audioContext.state==="suspended"
  ){
    audioContext.resume();
  }

  score=0;

  lives=3;

  gameSpeed=5;

  displaySpeed=100;

  nitro=100;

  nitroActive=false;

  running=true;

  paused=false;

  crashed=false;

  scoreText.innerText="0";

  livesText.innerText="3";

  speedText.innerText="100";

  nitroBar.style.width="100%";

  menu.style.display="none";

  pauseMenu.style.display="none";

  pauseButton.style.display="block";

  setPlayerStart();

  createRoadLines();

  lastEnemy=performance.now();

  lastCoin=performance.now();

  lastObstacle=performance.now();

  lastScenery=performance.now();

  lastTime=0;

  await startCountdown();

  if(!running)return;

  requestAnimationFrame(
    gameLoop
  );
}


/* ================= GAME OVER ================= */

function endGame(){

  if(crashed)return;

  running=false;

  crashed=true;

  createCrashEffect();

  beep(
    80,
    .5,
    "sawtooth"
  );

  if(score>best){

    best=score;

    localStorage.setItem(
      "crazyRoadBest",
      best
    );
  }

  bestText.innerText=best;

  menuBest.innerText=best;

  menuCoins.innerText=
  totalCoins;

  menuTitle.innerText=
  "💥 GAME OVER";

  menuSubtitle.innerText=
  "Score: "+score+
  " • Coins: "+totalCoins;

  playButton.innerText=
  "🔄 PLAY AGAIN";

  menu.style.display="flex";

  pauseButton.style.display=
  "none";

  enemies.forEach(
    x=>x.remove()
  );

  coinObjects.forEach(
    x=>x.remove()
  );

  obstacles.forEach(
    x=>x.remove()
  );

  sceneryObjects.forEach(
    x=>x.remove()
  );

  enemies=[];

  coinObjects=[];

  obstacles=[];

  sceneryObjects=[];
}


/* ================= PAUSE ================= */

pauseButton.addEventListener(
"click",
function(e){

  e.stopPropagation();

  if(
    !running||
    crashed
  )return;

  paused=true;

  pauseMenu.style.display=
  "flex";
});

resumeButton.addEventListener(
"click",
function(e){

  e.stopPropagation();

  paused=false;

  pauseMenu.style.display=
  "none";

  lastTime=
  performance.now();
});

quitButton.addEventListener(
"click",
function(e){

  e.stopPropagation();

  running=false;

  paused=false;

  pauseMenu.style.display=
  "none";

  pauseButton.style.display=
  "none";

  menuTitle.innerText=
  "CRAZY ROAD";

  menuSubtitle.innerText=
  "V3.1 — TOP-DOWN F1 RACER";

  playButton.innerText=
  "▶ PLAY";

  menuBest.innerText=best;

  menuCoins.innerText=
  totalCoins;

  menu.style.display=
  "flex";
});


/* ================= PLAY ================= */

playButton.addEventListener(
"click",
function(e){

  e.stopPropagation();

  startGame();
});


/* ================= SOUND ================= */

soundButton.addEventListener(
"click",
function(e){

  e.stopPropagation();

  soundOn=!soundOn;

  if(soundOn){

    soundButton.innerText=
    "🔊 SOUND ON";

    startAudio();

  }else{

    soundButton.innerText=
    "🔇 SOUND OFF";
  }
});


/* ================= RESIZE ================= */

window.addEventListener(
"resize",
function(){

  movePlayer(playerX);

});


/* ================= INITIALIZE ================= */

setPlayerStart();

createRoadLines();

</script>
