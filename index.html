<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Crazy Road V2.0</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #151515;
    font-family: Arial, sans-serif;
    touch-action: none;
}

#game {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #555;
}

#road {
    position: absolute;
    left: 8%;
    width: 84%;
    height: 100%;
    background: linear-gradient(
        90deg,
        #252525,
        #3c3c3c,
        #252525
    );

    border-left: 6px solid white;
    border-right: 6px solid white;

    overflow: hidden;
}


/* =========================
   ROAD LINES
========================= */

.roadLine {
    position: absolute;

    width: 7px;
    height: 85px;

    background: white;

    border-radius: 5px;

    left: 50%;

    transform: translateX(-50%);
}


/* =========================
   PLAYER F1 CAR
========================= */

#car {
    position: absolute;

    width: 64px;
    height: 110px;

    left: 50%;
    bottom: 55px;

    transform: translateX(-50%);

    background: linear-gradient(
        90deg,
        #750000,
        #ff1717,
        #b00000
    );

    border-radius: 18px 18px 12px 12px;

    box-shadow:
        0 6px 16px rgba(0,0,0,.8),
        inset 5px 0 5px rgba(255,255,255,.2);

    z-index: 20;
}


/* Cockpit */

#car::before {
    content: "";

    position: absolute;

    width: 40px;
    height: 30px;

    left: 12px;
    top: 18px;

    background: linear-gradient(
        135deg,
        #080808,
        #56616b,
        #080808
    );

    border-radius: 10px;
}


/* F1 center stripe */

#car::after {
    content: "";

    position: absolute;

    width: 7px;
    height: 95px;

    left: 28px;
    top: 8px;

    background: white;

    border-radius: 5px;
}


/* F1 wings */

.f1wing {
    position: absolute;

    left: -12px;

    width: 88px;
    height: 9px;

    background: #111;

    border-radius: 5px;
}

.frontWing {
    top: 4px;
}

.rearWing {
    bottom: 2px;
}


/* Player wheels */

.playerWheel {
    position: absolute;

    width: 10px;
    height: 28px;

    background: #080808;

    border-radius: 5px;

    z-index: -1;
}

.pwl {
    left: -7px;
    top: 27px;
}

.pwr {
    right: -7px;
    top: 27px;
}

.pwl2 {
    left: -7px;
    bottom: 20px;
}

.pwr2 {
    right: -7px;
    bottom: 20px;
}


/* =========================
   ENEMY CARS
========================= */

.enemy {
    position: absolute;

    width: 58px;
    height: 105px;

    border-radius: 17px 17px 11px 11px;

    box-shadow:
        0 5px 12px rgba(0,0,0,.75);

    z-index: 15;
}

.enemy::before {
    content: "";

    position: absolute;

    width: 38px;
    height: 28px;

    left: 10px;
    top: 15px;

    background: linear-gradient(
        135deg,
        #111,
        #59636b,
        #111
    );

    border-radius: 9px;
}

.enemy::after {
    content: "";

    position: absolute;

    width: 6px;
    height: 90px;

    left: 26px;
    top: 8px;

    background: rgba(255,255,255,.5);

    border-radius: 4px;
}

.green {
    background: linear-gradient(
        90deg,
        #087000,
        #20d51d,
        #087000
    );
}

.yellow {
    background: linear-gradient(
        90deg,
        #b07b00,
        #ffd21c,
        #b07b00
    );
}

.blue {
    background: linear-gradient(
        90deg,
        #003d9e,
        #087cff,
        #003d9e
    );
}

.white {
    background: linear-gradient(
        90deg,
        #999,
        #fff,
        #aaa
    );
}

.purple {
    background: linear-gradient(
        90deg,
        #55008f,
        #b62cff,
        #55008f
    );
}


/* =========================
   COIN
========================= */

.coin {
    position: absolute;

    width: 35px;
    height: 35px;

    border-radius: 50%;

    background: radial-gradient(
        circle,
        #fff36a,
        #ffd000 40%,
        #ef9800 75%,
        #9b5500
    );

    border: 3px solid #ffe45c;

    box-shadow:
        0 0 12px #ffd000,
        0 0 25px rgba(255,208,0,.5);

    z-index: 13;

    animation: coinSpin .55s linear infinite;
}

.coin::after {
    content: "★";

    position: absolute;

    color: white;

    font-size: 18px;

    left: 6px;
    top: 3px;
}

@keyframes coinSpin {

    0% {
        transform: rotateY(0deg);
    }

    50% {
        transform: rotateY(90deg);
    }

    100% {
        transform: rotateY(180deg);
    }

}


/* =========================
   OBSTACLES
========================= */

.obstacle {
    position: absolute;

    width: 55px;
    height: 38px;

    background: repeating-linear-gradient(
        135deg,
        #ff7b00,
        #ff7b00 9px,
        #222 9px,
        #222 18px
    );

    border: 3px solid white;

    border-radius: 7px;

    box-shadow:
        0 5px 12px rgba(0,0,0,.7);

    z-index: 14;
}

.cone {
    position: absolute;

    width: 28px;
    height: 42px;

    background: linear-gradient(
        90deg,
        #b83c00,
        #ff6500,
        #b83c00
    );

    clip-path: polygon(
        50% 0,
        100% 100%,
        0 100%
    );

    z-index: 14;
}


/* =========================
   HUD
========================= */

#hud {
    position: absolute;

    top: 12px;
    left: 12px;

    z-index: 50;

    color: white;

    background: rgba(0,0,0,.6);

    padding: 9px 13px;

    border-radius: 13px;

    font-size: 18px;

    line-height: 1.55;

    font-weight: bold;

    text-shadow: 2px 2px 3px black;
}

#speedText {
    color: #ffe000;
}


/* =========================
   PAUSE
========================= */

#pause {
    position: absolute;

    top: 15px;
    right: 15px;

    z-index: 60;

    width: 48px;
    height: 48px;

    border-radius: 50%;

    border: 2px solid white;

    background: rgba(0,0,0,.55);

    color: white;

    font-size: 22px;

    display: flex;
    align-items: center;
    justify-content: center;

    user-select: none;
}


/* =========================
   MESSAGE
========================= */

#message {
    position: absolute;

    left: 50%;
    top: 50%;

    transform: translate(-50%,-50%);

    z-index: 100;

    color: white;

    text-align: center;

    font-size: 29px;

    font-weight: bold;

    text-shadow: 2px 2px 5px black;

    background: rgba(0,0,0,.75);

    padding: 25px 30px;

    border-radius: 20px;

    border: 2px solid rgba(255,255,255,.45);

    min-width: 260px;
}


/* =========================
   CRASH EFFECT
========================= */

.crash {
    position: absolute;

    width: 100px;
    height: 100px;

    border-radius: 50%;

    border: 6px solid #ffb000;

    box-shadow:
        0 0 20px #ff6500,
        0 0 40px #ff0000;

    animation: crashAnim .5s ease-out forwards;

    z-index: 90;
}

@keyframes crashAnim {

    0% {
        transform: scale(.2);
        opacity: 1;
    }

    100% {
        transform: scale(2);
        opacity: 0;
    }

}


/* =========================
   COIN EFFECT
========================= */

.coinPop {
    position: absolute;

    color: #ffe000;

    font-size: 22px;

    font-weight: bold;

    z-index: 90;

    animation: coinPop .7s ease-out forwards;
}

@keyframes coinPop {

    0% {
        transform: translateY(0) scale(.5);
        opacity: 1;
    }

    100% {
        transform: translateY(-60px) scale(1.4);
        opacity: 0;
    }

}

</style>
</head>


<body>


<div id="game">

    <div id="road"></div>


    <div id="hud">

        🏆 Score:
        <span id="score">0</span>

        <br>

        🥇 Best:
        <span id="best">0</span>

        <br>

        🪙 Coins:
        <span id="coins">0</span>

        <br>

        ⚡ Speed:
        <span id="speedText">100</span>
        km/h

    </div>


    <div id="pause">Ⅱ</div>


    <div id="message">

        🏎️ CRAZY ROAD

        <br><br>

        Slide to Drive

        <br><br>

        Tap to Start

    </div>


    <div id="car">

        <div class="f1wing frontWing"></div>

        <div class="f1wing rearWing"></div>

        <div class="playerWheel pwl"></div>
        <div class="playerWheel pwr"></div>

        <div class="playerWheel pwl2"></div>
        <div class="playerWheel pwr2"></div>

    </div>

</div>


<script>


/* ==========================================
   ELEMENTS
========================================== */

const game =
    document.getElementById("game");

const road =
    document.getElementById("road");

const player =
    document.getElementById("car");

const message =
    document.getElementById("message");

const scoreText =
    document.getElementById("score");

const bestText =
    document.getElementById("best");

const coinsText =
    document.getElementById("coins");

const speedText =
    document.getElementById("speedText");

const pauseButton =
    document.getElementById("pause");


/* ==========================================
   VARIABLES
========================================== */

let playerX = 0;

let score = 0;

let coins = 0;

let totalCoins =
    Number(
        localStorage.getItem("crazyRoadCoins")
    ) || 0;

let best =
    Number(
        localStorage.getItem("crazyRoadBest")
    ) || 0;

let gameSpeed = 5;

let displaySpeed = 100;

let running = false;

let paused = false;

let crashed = false;

let enemies = [];

let coinObjects = [];

let obstacles = [];

let roadLines = [];

let lastEnemyTime = 0;

let lastCoinTime = 0;

let lastObstacleTime = 0;

let lastTime = 0;

let lastTouchX = 0;

let audioStarted = false;

let audioContext;


/* ==========================================
   DISPLAY SAVED DATA
========================================== */

bestText.innerText = best;

coinsText.innerText = totalCoins;


/* ==========================================
   AUDIO
========================================== */

function startAudio() {

    if (audioStarted)
        return;

    try {

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

        audioStarted = true;

    } catch (e) {

        console.log("Audio unavailable");

    }

}


function beep(
    frequency,
    duration,
    type = "sine"
) {

    if (!audioContext)
        return;

    const oscillator =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();


    oscillator.type = type;

    oscillator.frequency.value =
        frequency;

    gain.gain.setValueAtTime(
        .08,
        audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        .001,
        audioContext.currentTime + duration
    );


    oscillator.connect(gain);

    gain.connect(audioContext.destination);


    oscillator.start();

    oscillator.stop(
        audioContext.currentTime +
        duration
    );

}


/* ==========================================
   PLAYER POSITION
========================================== */

function setPlayerStart() {

    playerX =
        road.offsetLeft +
        road.clientWidth / 2;

    player.style.left =
        playerX + "px";

}


/* ==========================================
   SMOOTH SLIDING
========================================== */

game.addEventListener(
    "touchstart",
    function(event) {

        event.preventDefault();

        startAudio();


        if (!running && !crashed) {

            startGame();

        }


        if (crashed) {

            location.reload();

            return;

        }


        const touch =
            event.touches[0];

        lastTouchX =
            touch.clientX;

    },
    { passive: false }
);


game.addEventListener(
    "touchmove",
    function(event) {

        event.preventDefault();


        if (!running || paused || crashed)
            return;


        const touch =
            event.touches[0];


        const currentX =
            touch.clientX;


        const movement =
            currentX - lastTouchX;


        playerX += movement;


        lastTouchX =
            currentX;


        const roadLeft =
            road.offsetLeft;

        const roadRight =
            road.offsetLeft +
            road.clientWidth;


        const half =
            player.offsetWidth / 2;


        if (
            playerX <
            roadLeft + half
        ) {

            playerX =
                roadLeft + half;

        }


        if (
            playerX >
            roadRight - half
        ) {

            playerX =
                roadRight - half;

        }


        player.style.left =
            playerX + "px";

    },
    { passive: false }
);


/* ==========================================
   PAUSE
========================================== */

pauseButton.addEventListener(
    "touchstart",
    function(event) {

        event.preventDefault();

        if (!running || crashed)
            return;


        paused =
            !paused;


        if (paused) {

            pauseButton.innerText =
                "▶";

            message.innerHTML =
                "⏸️ PAUSED";

            message.style.display =
                "block";

        } else {

            pauseButton.innerText =
                "Ⅱ";

            message.style.display =
                "none";

            lastTime =
                performance.now();

        }

    },
    { passive: false }
);


/* ==========================================
   ROAD LINES
========================================== */

function createRoadLines() {

    roadLines.forEach(
        line => line.remove()
    );

    roadLines = [];


    for (
        let i = 0;
        i < 9;
        i++
    ) {

        const line =
            document.createElement("div");

        line.className =
            "roadLine";

        line.style.top =
            (i * 130 - 120) + "px";

        road.appendChild(line);

        roadLines.push(line);

    }

}


/* ==========================================
   RANDOM ENEMY
========================================== */

function createEnemy() {

    if (!running || paused)
        return;


    const colors = [
        "green",
        "yellow",
        "blue",
        "white",
        "purple"
    ];


    const enemy =
        document.createElement("div");


    enemy.className =
        "enemy " +
        colors[
            Math.floor(
                Math.random() *
                colors.length
            )
        ];


    const roadWidth =
        road.clientWidth;


    const x =
        Math.random() *
        (roadWidth - 58);


    enemy.style.left =
        x + "px";


    enemy.style.top =
        (
            -120 -
            Math.random() * 250
        ) + "px";


    const randomSpeed =
        gameSpeed *
        (
            .65 +
            Math.random() * .9
        );


    enemy.dataset.speed =
        randomSpeed;


    road.appendChild(enemy);

    enemies.push(enemy);

}


/* ==========================================
   COIN
========================================== */

function createCoin() {

    if (!running || paused)
        return;


    const coin =
        document.createElement("div");


    coin.className =
        "coin";


    const x =
        15 +
        Math.random() *
        (road.clientWidth - 50);


    coin.style.left =
        x + "px";


    coin.style.top =
        (
            -60 -
            Math.random() * 150
        ) + "px";


    road.appendChild(coin);

    coinObjects.push(coin);

}


/* ==========================================
   OBSTACLE
========================================== */

function createObstacle() {

    if (!running || paused)
        return;


    const useCone =
        Math.random() < .5;


    const obstacle =
        document.createElement("div");


    obstacle.className =
        useCone
        ? "cone"
        : "obstacle";


    const x =
        15 +
        Math.random() *
        (road.clientWidth - 70);


    obstacle.style.left =
        x + "px";


    obstacle.style.top =
        (
            -80 -
            Math.random() * 200
        ) + "px";


    obstacle.dataset.speed =
        gameSpeed *
        (
            .8 +
            Math.random() * .4
        );


    road.appendChild(obstacle);

    obstacles.push(obstacle);

}


/* ==========================================
   COLLISION
========================================== */

function isColliding(a, b) {

    const A =
        a.getBoundingClientRect();

    const B =
        b.getBoundingClientRect();


    return !(
        A.bottom < B.top ||
        A.top > B.bottom ||
        A.right < B.left ||
        A.left > B.right
    );

}


/* ==========================================
   ROAD UPDATE
========================================== */

function updateRoad(delta) {

    roadLines.forEach(
        function(line) {

            let y =
                parseFloat(
                    line.style.top
                );


            y +=
                gameSpeed * delta;


            if (
                y >
                window.innerHeight
            ) {

                y = -100;

            }


            line.style.top =
                y + "px";

        }
    );

}


/* ==========================================
   ENEMY UPDATE
========================================== */

function updateEnemies(delta) {

    for (
        let i = enemies.length - 1;
        i >= 0;
        i--
    ) {

        const enemy =
            enemies[i];


        let y =
            parseFloat(
                enemy.style.top
            );


        const speed =
            parseFloat(
                enemy.dataset.speed
            );


        y +=
            speed * delta;


        enemy.style.top =
            y + "px";


        if (
            isColliding(
                player,
                enemy
            )
        ) {

            endGame();

            return;

        }


        if (
            y >
            window.innerHeight + 120
        ) {

            enemy.remove();

            enemies.splice(i, 1);


            score += 10;

            scoreText.innerText =
                score;


            checkSpeed();

        }

    }

}


/* ==========================================
   COIN UPDATE
========================================== */

function updateCoins(delta) {

    for (
        let i = coinObjects.length - 1;
        i >= 0;
        i--
    ) {

        const coin =
            coinObjects[i];


        let y =
            parseFloat(
                coin.style.top
            );


        y +=
            gameSpeed * delta;


        coin.style.top =
            y + "px";


        if (
            isColliding(
                player,
                coin
            )
        ) {

            const rect =
                coin.getBoundingClientRect();


            createCoinEffect(
                rect.left,
                rect.top
            );


            beep(
                900,
                .12,
                "square"
            );


            coin.remove();

            coinObjects.splice(i, 1);


            coins++;

            totalCoins++;

            score += 25;


            scoreText.innerText =
                score;

            coinsText.innerText =
                totalCoins;


            localStorage.setItem(
                "crazyRoadCoins",
                totalCoins
            );


            checkSpeed();

            continue;

        }


        if (
            y >
            window.innerHeight + 60
        ) {

            coin.remove();

            coinObjects.splice(i, 1);

        }

    }

}


/* ==========================================
   OBSTACLE UPDATE
========================================== */

function updateObstacles(delta) {

    for (
        let i = obstacles.length - 1;
        i >= 0;
        i--
    ) {

        const obstacle =
            obstacles[i];


        let y =
            parseFloat(
                obstacle.style.top
            );


        const speed =
            parseFloat(
                obstacle.dataset.speed
            );


        y +=
            speed * delta;


        obstacle.style.top =
            y + "px";


        if (
            isColliding(
                player,
                obstacle
            )
        ) {

            endGame();

            return;

        }


        if (
            y >
            window.innerHeight + 100
        ) {

            obstacle.remove();

            obstacles.splice(i, 1);

            score += 5;

            scoreText.innerText =
                score;

        }

    }

}


/* ==========================================
   SPEED
========================================== */

function checkSpeed() {

    const level =
        Math.floor(
            score / 500
        );


    const newSpeed =
        5 +
        level * 2;


    if (
        newSpeed !== gameSpeed
    ) {

        gameSpeed =
            newSpeed;


        displaySpeed =
            100 +
            level * 30;


        speedText.innerText =
            displaySpeed;


        beep(
            600,
            .15,
            "sawtooth"
        );

    }

}


/* ==========================================
   COIN EFFECT
========================================== */

function createCoinEffect(x, y) {

    const effect =
        document.createElement("div");


    effect.className =
        "coinPop";


    effect.innerText =
        "+25";


    effect.style.left =
        x + "px";


    effect.style.top =
        y + "px";


    game.appendChild(effect);


    setTimeout(
        function() {

            effect.remove();

        },
        700
    );

}


/* ==========================================
   CRASH EFFECT
========================================== */

function createCrashEffect() {

    const effect =
        document.createElement("div");


    effect.className =
        "crash";


    effect.style.left =
        (
            playerX - 50
        ) + "px";


    effect.style.top =
        (
            window.innerHeight - 180
        ) + "px";


    game.appendChild(effect);


    setTimeout(
        function() {

            effect.remove();

        },
        600
    );

}


/* ==========================================
   GAME LOOP
========================================== */

function gameLoop(time) {

    if (!running)
        return;


    if (paused) {

        requestAnimationFrame(
            gameLoop
        );

        return;

    }


    if (!lastTime)
        lastTime = time;


    let delta =
        (
            time - lastTime
        ) / 16.67;


    if (delta > 2)
        delta = 2;


    lastTime =
        time;


    updateRoad(delta);

    updateEnemies(delta);

    updateCoins(delta);

    updateObstacles(delta);


    /* Random enemy timing */

    const enemyDelay =
        Math.max(
            450,
            1150 -
            score * .4
        );


    if (
        time - lastEnemyTime >
        enemyDelay +
        Math.random() * 700
    ) {

        createEnemy();

        lastEnemyTime =
            time;

    }


    /* Coins */

    if (
        time - lastCoinTime >
        650 +
        Math.random() * 900
    ) {

        createCoin();

        lastCoinTime =
            time;

    }


    /* Obstacles start appearing
       more often later */

    if (
        score > 100 &&
        time - lastObstacleTime >
        1500 +
        Math.random() * 1500
    ) {

        createObstacle();

        lastObstacleTime =
            time;

    }


    requestAnimationFrame(
        gameLoop
    );

}


/* ==========================================
   START GAME
========================================== */

function startGame() {

    if (running)
        return;


    startAudio();


    running = true;

    paused = false;

    crashed = false;


    score = 0;

    coins = 0;


    gameSpeed = 5;

    displaySpeed = 100;


    scoreText.innerText =
        "0";

    speedText.innerText =
        "100";


    message.style.display =
        "none";


    pauseButton.style.display =
        "flex";


    setPlayerStart();

    createRoadLines();


    lastEnemyTime =
        performance.now();


    lastCoinTime =
        performance.now();


    lastObstacleTime =
        performance.now();


    lastTime = 0;


    beep(
        500,
        .15,
        "square"
    );


    requestAnimationFrame(
        gameLoop
    );

}


/* ==========================================
   GAME OVER
========================================== */

function endGame() {

    if (crashed)
        return;


    running = false;

    crashed = true;


    createCrashEffect();


    beep(
        100,
        .5,
        "sawtooth"
    );


    if (
        score > best
    ) {

        best =
            score;


        localStorage.setItem(
            "crazyRoadBest",
            best
        );

    }


    bestText.innerText =
        best;


    message.innerHTML =

        "💥 CRASH!<br><br>" +

        "🏆 Score: " +
        score +

        "<br>" +

        "🥇 Best: " +
        best +

        "<br>" +

        "🪙 Coins: " +
        coins +

        "<br><br>" +

        "Tap to Restart";


    message.style.display =
        "block";


    enemies.forEach(
        enemy => enemy.remove()
    );

    enemies = [];


    coinObjects.forEach(
        coin => coin.remove()
    );

    coinObjects = [];


    obstacles.forEach(
        obstacle => obstacle.remove()
    );

    obstacles = [];

}


/* ==========================================
   INITIAL SETUP
========================================== */

setPlayerStart();

createRoadLines();

pauseButton.style.display =
    "none";


</script>

</body>
</html>
